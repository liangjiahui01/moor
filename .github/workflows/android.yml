name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # moor-rtc (direct connections) is built into the APK by Gradle
      - uses: actions/setup-go@v5
        with:
          go-version-file: rtc/go.mod
          cache-dependency-path: rtc/go.sum

      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "No signing secrets; using the debug key"; exit 0; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || V="dev-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/release/app-release.apk "moor-$V.apk"

      - name: moor-rtc for machines and relays
        working-directory: rtc
        run: |
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-s -w" -o ../android/moor-rtc-linux-$a .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: moor-apk
          path: |
            android/moor-*.apk
            android/moor-rtc-linux-*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/moor-*.apk
            android/moor-rtc-linux-*
          generate_release_notes: true
