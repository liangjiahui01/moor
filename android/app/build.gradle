plugins {
    id "com.android.application"
}

android {
    namespace "io.github.liangjiahui01.moor"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.liangjiahui01.moor"
        minSdk 26
        targetSdk 34
        versionCode 29
        versionName "0.10.12"

        // Optional prefill for the settings screen, from defaults.properties (not in git):
        //   host=my-box.example.com
        //   user=me
        def dp = new Properties()
        def f = rootProject.file("defaults.properties")
        if (f.exists()) f.withInputStream { dp.load(it) }
        buildConfigField "String", "DEFAULT_HOST", "\"${dp.getProperty('host', '')}\""
        buildConfigField "String", "DEFAULT_USER", "\"${dp.getProperty('user', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def kp = new Properties()
            def kf = rootProject.file("keystore.properties")
            if (kf.exists()) {
                kf.withInputStream { kp.load(it) }
                storeFile rootProject.file(kp.getProperty("storeFile"))
                storePassword kp.getProperty("storePassword")
                keyAlias kp.getProperty("keyAlias")
                keyPassword kp.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with a release keystore when keystore.properties exists, else the debug key
            signingConfig rootProject.file("keystore.properties").exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["META-INF/versions/*/OSGI-INF/MANIFEST.MF", "META-INF/*.md"]
        }
        // moor-rtc is an executable shipped as lib*.so; it must be extracted to run
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        noCompress += "ttf"
    }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir("generated/moor-assets")
        main.jniLibs.srcDirs += layout.buildDirectory.dir("generated/moor-jni")
    }
}

// Ship the host helper inside the APK; the app installs it on the host when it connects.
def copyServerHelper = tasks.register("copyServerHelper", Copy) {
    from(rootProject.file("../server/moor"))
    into(layout.buildDirectory.dir("generated/moor-assets/server"))
}
tasks.named("preBuild") { dependsOn copyServerHelper }

// Direct connections: build moor-rtc (Go, ../rtc) for the phone ABIs. Without Go the app still
// builds; it then connects the usual way only.
def rtcAbis = ["arm64-v8a": "arm64"]
def buildRtc = tasks.register("buildRtc") {
    def src = rootProject.file("../rtc")
    def out = layout.buildDirectory.dir("generated/moor-jni")
    inputs.files(fileTree(src) { include "**/*.go", "go.mod", "go.sum" })
    outputs.dir(out)
    doLast {
        def go = ["go", "${System.getProperty("user.home")}/.local/go/bin/go", "/usr/local/go/bin/go"].find { g ->
            try { return [g, "version"].execute().waitFor() == 0 } catch (Exception ignored) { return false }
        }
        if (go == null) {
            logger.warn("Go not found: building without direct connections (moor-rtc)")
            return
        }
        rtcAbis.each { abi, arch ->
            def dest = out.get().file("${abi}/libmoorrtc.so").asFile
            dest.parentFile.mkdirs()
            // GOOS=android: pion lists network interfaces through wlynxg/anet there, since apps may not
            // read them over netlink; anet links into the net package, hence -checklinkname=0
            def pb = new ProcessBuilder(go, "build", "-trimpath", "-buildvcs=false", "-ldflags", "-s -w -checklinkname=0",
                "-o", dest.absolutePath, ".").directory(src).redirectErrorStream(true)
            pb.environment().putAll([GOOS: "android", GOARCH: arch, CGO_ENABLED: "0"])
            def p = pb.start()
            def log = p.inputStream.text
            if (p.waitFor() != 0) throw new GradleException("moor-rtc build failed for ${abi}:\n${log}")
        }
    }
}
tasks.named("preBuild") { dependsOn buildRtc }

dependencies {
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "com.github.mwiede:jsch:0.2.21"
    implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"
    // QR scanning without Google Play services
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "androidx.core:core:1.13.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
